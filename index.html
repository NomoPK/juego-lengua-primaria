<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiTuto-R</title>
  <style>
    :root{--ink:#1e3147;--muted:#5d6b7c;--paper:#fffdf7;--sky:#dff4f2;--blue:#2169a8;--blue-dark:#164c7d;--orange:#ef9b37;--green:#278266;--red:#b94646;--line:#c8d8df;--shadow:0 10px 25px rgba(31,61,80,.12)}
    *{box-sizing:border-box} body{margin:0;background:#edf5f4;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45} button,input,textarea,select{font:inherit} button{cursor:pointer}.shell{max-width:980px;margin:auto;padding:22px 18px 48px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:4px solid var(--orange);padding:8px 0 18px}.eyebrow{font:700 .78rem/1.1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{margin:.25rem 0 0;font-size:clamp(2rem,7vw,3.9rem);line-height:.98;letter-spacing:-.045em}.top p{max-width:480px;margin:.8rem 0 0;color:var(--muted)}.selectors{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.selector{display:grid;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:700 .78rem Arial,sans-serif;color:var(--muted)}.selector select{border:0;background:transparent;color:var(--ink);font-weight:bold;font-size:1rem}.progress{margin:24px 0 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px 16px;box-shadow:var(--shadow)}.progress-line{display:flex;justify-content:space-between;gap:12px;font-family:Arial,sans-serif;font-size:.9rem;font-weight:bold}.track{height:10px;background:#e3eced;border-radius:99px;margin-top:9px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.station{min-height:86px;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:bold}.station:hover,.station:focus-visible{border-color:var(--blue);outline:none}.station.done{border-color:var(--green);background:#effaf6}.station small{display:block;font-family:Arial,sans-serif;font-size:.76rem;font-weight:normal;color:var(--muted);margin-top:5px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.badge{display:inline-block;padding:5px 9px;background:var(--sky);color:var(--blue-dark);border-radius:999px;font:700 .75rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}.panel h2{margin:.6rem 0;font-size:clamp(1.65rem,5vw,2.4rem);line-height:1.05}.lead{color:var(--muted);font-size:1.08rem}.question{margin:22px 0 12px;font-size:1.25rem;font-weight:bold}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:bold}.choice:hover:not(:disabled),.choice:focus-visible{border-color:var(--blue);outline:none;background:#f2f8ff}.choice.correct{border-color:var(--green);background:#eaf8f1}.choice.wrong{border-color:var(--red);background:#fff0f0}.choice:disabled{cursor:default}.feedback{min-height:26px;margin:18px 0 0;font-weight:bold}.ok{color:var(--green)}.no{color:var(--red)}.explain{display:block;margin-top:7px;color:var(--ink);font-weight:normal}.passage,.result,.dictation-box{margin:18px 0;padding:17px;border-radius:12px;background:#f4f8f7;border:1px solid var(--line)}textarea,.word-input{width:100%;min-height:118px;padding:12px;border:2px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff;font-size:1.05rem}textarea:focus,.word-input:focus{outline:3px solid rgba(33,105,168,.22);border-color:var(--blue)}.word-input{min-height:auto;font-size:1.4rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.secondary{padding:12px 16px;border-radius:10px;border:2px solid var(--blue);font-weight:bold}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#fff;color:var(--blue)}.hint{font-size:.9rem;color:var(--muted)}.word-card{margin:18px 0;padding:18px;border:2px dashed var(--orange);border-radius:14px;background:#fff8e8;text-align:center;font:700 clamp(2.2rem,10vw,4rem)/1 Arial,sans-serif;letter-spacing:.06em}.hangman-word{margin:22px 0 10px;text-align:center;font:700 clamp(2rem,9vw,3.6rem)/1.2 Arial,sans-serif;letter-spacing:.18em;color:var(--blue)}.letter-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:20px 0}.letter{min-height:45px;border:2px solid var(--line);border-radius:9px;background:#fff;font:700 1.1rem Arial,sans-serif;color:var(--ink)}.letter:disabled{opacity:.45;cursor:default}.footer{margin:18px 0;color:var(--muted);font-size:.9rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.top{display:block}.selectors{justify-content:flex-start;margin-top:18px}.stations{grid-template-columns:1fr}.panel{padding:22px 18px}.letter-grid{grid-template-columns:repeat(6,1fr)}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div><div class="eyebrow" id="eyebrow">Juego de deberes</div><h1>MiTuto-R</h1><p id="intro">Elige una asignatura, completa las tres paradas y desbloquea el examen final.</p></div><div class="selectors"><label class="selector">Asignatura<select id="subject" aria-label="Elegir asignatura"><option value="lengua">Lengua</option><option value="sociales">Ciencias Sociales</option></select></label><label class="selector">Curso<select id="grade" aria-label="Elegir curso"></select></label></div></header>
  <section class="progress" aria-label="Progreso"><div class="progress-line"><span id="progressText">0 de 3 paradas completadas</span><span id="badgeText">Explorador/a</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
  <nav class="stations" aria-label="Paradas del juego"></nav>
  <section class="panel" id="app" aria-live="polite"></section>
  <p class="footer" id="footer">Consejo para adultos: acompaña la explicación antes de pasar a la siguiente pregunta.</p>
</main>
<script>
const lang={
  1:{
    title:'Lengua · 1.º de Primaria',
    stations:[
      {id:'readWords',title:'1. Lee palabras',subtitle:'Lee y elige',type:'choice',intro:'Mira las letras y elige la palabra que te pide la pregunta.',questions:[['¿Cuál de estas palabras dice «sol»?',['sol','sal','sopa'],0],['¿Cuál de estas palabras dice «mesa»?',['masa','mesa','misa'],1],['¿Cuál de estas palabras dice «luna»?',['lana','luna','lona'],1]]},
      {id:'writeWords',title:'2. Escribe palabras',subtitle:'Copia palabras cortas',type:'write',words:['sol','casa','mesa'],intro:'Mira la palabra y escríbela despacio.'},
      {id:'hangman',title:'3. Ahorcado',subtitle:'Adivina la palabra',type:'hangman',words:['sol','casa','mesa','luna','pato','mano']}
    ], exam:null
  },
  3:{
    title:'Lengua · 3.º de Primaria',
    stations:[
      {id:'vocab',title:'1. Palabras relacionadas',subtitle:'Sinónimos y antónimos',type:'choice',intro:'Lee con atención: te pedirá una palabra parecida o una palabra contraria.',questions:[['Elige el sinónimo de «comenzar».',['terminar','empezar','olvidar'],1],['Elige el antónimo de «generoso».',['egoísta','amable','alegre'],0],['Elige el sinónimo de «valiente».',['miedoso','atrevido','débil'],1]]},
      {id:'read',title:'2. Lectura',subtitle:'Comprender un texto',type:'choice',passage:'El sábado, Marcos preparó una maceta para su balcón. Llenó el recipiente de tierra, plantó tres semillas de albahaca y las regó con cuidado. Cada mañana comprobará si han empezado a crecer.',intro:'Lee el texto con calma antes de responder.',questions:[['¿Qué plantó Marcos?',['Tres semillas de albahaca','Un árbol de manzanas','Una flor de papel'],0],['¿Dónde puso la maceta?',['En el balcón','En el colegio','En la cocina'],0],['¿Para qué revisará la maceta cada mañana?',['Para cambiarla de sitio','Para comprobar si crecen las semillas','Para recoger hojas'],1]]},
      {id:'dict',title:'3. Dictado',subtitle:'Escuchar y escribir',type:'dictation',text:'Hoy, Hugo visitó la biblioteca de Beatriz. Había varios libros sobre volcanes y vehículos. Volvimos a casa en autobús, muy contentos.'}
    ], exam:'language'
  }
};
const social={
  3:{title:'Ciencias Sociales · 3.º de Primaria',stations:[
    {id:'people',title:'1. Personas y convivencia',subtitle:'Familia, amistades y emociones',type:'choice',intro:'Repasa cómo convivimos con la familia, las amistades y otras personas.',questions:[
      ['¿Qué es la empatía?',['Imponer siempre mi opinión','Comprender cómo se siente otra persona','No escuchar a nadie'],1,'La empatía consiste en comprender cómo se sienten otras personas.'],
      ['¿Qué debemos hacer en la familia?',['Ayudarnos, escucharnos, respetarnos y colaborar','Gritar para conseguir lo que queremos','No contar nunca cómo nos sentimos'],0,'En la familia convivimos mejor cuando ayudamos, escuchamos, respetamos y colaboramos.'],
      ['¿Qué conducta ayuda a resolver los conflictos de forma pacífica?',['Insultar','Dialogar y buscar acuerdos','Ignorar siempre el problema'],1,'El diálogo ayuda a entendernos y a buscar acuerdos.'],
      ['¿Qué significa colaborar?',['Trabajar juntos para conseguir algo','Hacer que otra persona lo haga todo','No participar nunca'],0,'Colaborar es participar y trabajar juntos.']
    ]},
    {id:'town',title:'2. Colegio y localidad',subtitle:'Normas, ayuntamiento y servicios',type:'choice',intro:'Repasa las normas de convivencia, el ayuntamiento y los servicios de la localidad.',questions:[
      ['¿Quiénes forman parte de la comunidad escolar?',['Solo el alumnado','Alumnado, familias y personas que trabajan en el colegio','Solo las familias'],1,'La comunidad escolar reúne al alumnado, las familias y las personas que trabajan en el colegio.'],
      ['¿Para qué sirven las normas de convivencia del colegio?',['Para convivir, aprender y estar bien juntos','Para que nadie pueda participar','Para castigar sin explicar'],0,'Las normas ayudan a convivir y aprender con respeto.'],
      ['¿Qué institución organiza la localidad y cuida de su funcionamiento?',['El ayuntamiento','Una tienda','La biblioteca'],0,'El ayuntamiento organiza muchos asuntos de la localidad.'],
      ['¿Qué servicio público municipal se ocupa, entre otras cosas, de calles, farolas, bancos, parques y jardines?',['Mantenimiento y limpieza','Una consulta médica','Una clase de música'],0,'Los servicios municipales cuidan y mantienen los espacios comunes.']
    ]},
    {id:'road',title:'3. Seguridad vial',subtitle:'Señales, cruces y protecciones',type:'choice',intro:'Repasa las normas y señales que ayudan a circular de forma segura.',questions:[
      ['¿Qué es la seguridad vial?',['Normas y medidas para desplazarnos de forma segura','Una carrera de coches','Ir rápido para llegar antes'],0,'La seguridad vial reúne normas y medidas para movernos de forma segura.'],
      ['¿En qué orden debemos mirar para cruzar la calle?',['Derecha, izquierda y derecha','Izquierda, derecha e izquierda','Solo hacia delante'],1,'Antes de cruzar, miramos a la izquierda, a la derecha y otra vez a la izquierda.'],
      ['¿Qué nos indican las señales de tráfico?',['Normas, peligros e indicaciones para circular','El nombre de todas las calles','Qué juguete comprar'],0,'Las señales informan de normas, peligros e indicaciones.'],
      ['¿Cuándo debemos llevar protecciones?',['Al ir en bicicleta, patinete, monopatín o patines','Solo cuando llueve','Nunca'],0,'Las protecciones ayudan a evitar lesiones al usar bicicleta, patinete, monopatín o patines.']
    ]}
  ],exam:'social'}
};
const $=s=>document.querySelector(s); const app=$('#app');
let subject=localStorage.getItem('rutaSubject')||'lengua'; let grade=localStorage.getItem('rutaGrade')||'1'; let station=''; let index=0; let done=[]; let exam=[]; let examIndex=0; let score=0; let hangman={word:'',guesses:[]};
function model(){return subject==='lengua'?lang[grade]:social[grade]}
function validGrades(){return subject==='lengua'?['1','3']:['3']}
function progressKey(){return `ruta-v3-${subject}-${grade}`}
function migrateDone(){let saved=JSON.parse(localStorage.getItem(progressKey())||'[]');if(subject==='lengua'&&saved.length===0){const old=JSON.parse(localStorage.getItem(`lenguaDone-v2-${grade}`)||localStorage.getItem(`lenguaDone${grade}`)||'[]');const valid=model().stations.map(s=>s.id);saved=old.map(x=>x==='syn'||x==='ant'?'vocab':x).filter(x=>valid.includes(x));}saved=[...new Set(saved)].filter(x=>model().stations.some(s=>s.id===x));localStorage.setItem(progressKey(),JSON.stringify(saved));return saved}
function setupSelectors(){const subjectSelect=$('#subject'),gradeSelect=$('#grade');subjectSelect.value=subject;gradeSelect.innerHTML=validGrades().map(g=>`<option value="${g}">${g}.º de Primaria</option>`).join('');if(!validGrades().includes(grade))grade=validGrades()[0];gradeSelect.value=grade;subjectSelect.onchange=e=>{subject=e.target.value;grade=validGrades()[0];switchRoute()};gradeSelect.onchange=e=>{grade=e.target.value;switchRoute()}}
function switchRoute(){localStorage.setItem('rutaSubject',subject);localStorage.setItem('rutaGrade',grade);setupSelectors();done=migrateDone();station=model().stations[0].id;index=0;hangman={word:'',guesses:[]};refreshStations();render()}
function refreshStations(){$('.stations').innerHTML=model().stations.map(s=>`<button class="station" data-station="${s.id}"><strong>${s.title}</strong><small>${s.subtitle}</small></button>`).join('');document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;hangman={word:'',guesses:[]};render()})}
function updateHeader(){const isSocial=subject==='sociales';$('#eyebrow').textContent=isSocial?'Juego de deberes · Ciencias Sociales':'Juego de deberes · Lengua';$('#intro').textContent=isSocial?'Completa las tres paradas de Ciencias Sociales y desbloquea el examen final.':'Elige una asignatura, completa las tres paradas y desbloquea el examen final.';$('#footer').textContent=isSocial?'Material de repaso elaborado solo a partir de los seis esquemas facilitados para 3.º de Primaria.':'Consejo para adultos: el dictado puede escucharse con el botón de audio o leerse en voz alta sin que el niño vea la frase.'}
function save(){localStorage.setItem(progressKey(),JSON.stringify(done));updateProgress()}
function updateProgress(){const n=done.length,total=model().stations.length;$('#progressText').textContent=`${n} de ${total} paradas completadas`;$('#fill').style.width=(n/total*100)+'%';$('#badgeText').textContent=n===total?'¡Ruta terminada!':n>1?'Aprendiz':'Explorador/a';document.querySelectorAll('.station').forEach(b=>b.classList.toggle('done',done.includes(b.dataset.station)))}
function markDone(){if(!done.includes(station)){done.push(station);save()}}
function renderChoice(s){const q=s.questions[index];app.innerHTML=`<div class="badge">${s.title}</div><h2>${s.title.replace(/^\d\. /,'')}</h2><p class="lead">${s.intro}</p>${s.passage?`<div class="passage">${s.passage}</div>`:''}<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="answer(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function answer(selected){const q=model().stations.find(s=>s.id===station).questions[index],correct=q[2],good=selected===correct;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':`<span class="no">Casi. La respuesta correcta está marcada en verde.${q[3]?`<span class="explain">${q[3]}</span>`:''}</span>`;setTimeout(()=>{index++;const s=model().stations.find(x=>x.id===station);if(index>=s.questions.length){markDone();finishStation()}else render()},good?850:1600)}
function renderWrite(s){const word=s.words[index];app.innerHTML=`<div class="badge">${s.title}</div><h2>Copia una palabra</h2><p class="lead">${s.intro}</p><div class="word-card">${word}</div><label class="sr-only" for="wordInput">Escribe la palabra</label><input class="word-input" id="wordInput" autocomplete="off" autocapitalize="off" placeholder="Escribe aquí"><div class="actions"><button class="primary" onclick="checkWord()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function checkWord(){const s=model().stations.find(x=>x.id===station),word=s.words[index],input=$('#wordInput'),good=input.value.trim().toLowerCase()===word;input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! La has escrito correctamente.</span>':`<span class="no">La palabra era «${word}».</span>`;setTimeout(()=>{index++;if(index>=s.words.length){markDone();finishStation()}else render()},900)}
function renderHangman(s){if(!hangman.word)hangman={word:s.words[Math.floor(Math.random()*s.words.length)],guesses:[]};const letters='abcdefghijklmnñopqrstuvwxyz'.split(''),word=hangman.word,visible=word.split('').map(l=>hangman.guesses.includes(l)?l:'_').join(' '),mistakes=hangman.guesses.filter(l=>!word.includes(l));app.innerHTML=`<div class="badge">${s.title}</div><h2>Adivina la palabra</h2><p class="lead">Pulsa las letras. Tienes seis intentos que no estén en la palabra.</p><div class="hangman-word">${visible}</div><p class="hint">Fallos: ${mistakes.length} de 6 ${mistakes.length?'· '+mistakes.join(', '):''}</p><div class="letter-grid">${letters.map(l=>`<button class="letter" ${hangman.guesses.includes(l)?'disabled':''} onclick="guessLetter('${l}')">${l}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function guessLetter(letter){if(hangman.guesses.includes(letter))return;hangman.guesses.push(letter);const word=hangman.word,won=word.split('').every(l=>hangman.guesses.includes(l)),mistakes=hangman.guesses.filter(l=>!word.includes(l)).length;if(won){render();$('#feedback').innerHTML='<span class="ok">¡Muy bien! Has adivinado la palabra.</span>';document.querySelectorAll('.letter').forEach(b=>b.disabled=true);markDone();setTimeout(finishStation,1000);return}if(mistakes>=6){app.innerHTML=`<div class="badge">Ahorcado</div><h2>La palabra era «${word}»</h2><p class="lead">No pasa nada. Prueba otra palabra.</p><button class="primary" onclick="hangman={word:'',guesses:[]};render()">Jugar otra vez</button>`;return}render()}
function renderDictation(s){const text=s.text;app.innerHTML=`<div class="badge">${s.title}</div><h2>Escucha y escribe</h2><p class="lead">Pulsa «Reproducir dictado», escucha la frase las veces que necesites y escríbela. No verás el texto antes de comprobarlo.</p><div class="dictation-box"><button class="primary" onclick="speak()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg">Tu navegador no puede reproducir el audio.</audio><label class="sr-only" for="dictation">Escribe el dictado</label><textarea id="dictation" autocomplete="off" rows="4" placeholder="Escribe aquí las frases"></textarea><p class="hint">La corrección revisa mayúsculas, minúsculas, tildes y signos de puntuación.</p></div><div class="actions"><button class="primary" onclick="checkDictation()">Comprobar</button></div><p class="feedback" id="feedback"></p>`}
function normalize(s){return s.replace(/\s+/g,' ').trim()}
function speak(){const audio=$('#dictationAudio');audio.currentTime=0;const p=audio.play();if(p)p.catch(()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(model().stations.find(s=>s.id===station).text);u.lang='es-ES';u.rate=.78;speechSynthesis.speak(u)}})}
function checkDictation(){const s=model().stations.find(x=>x.id===station),input=$('#dictation'),good=normalize(input.value)===normalize(s.text);input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Dictado correcto! Has escrito todas las frases.</span>':`<span class="no">Hay algo que corregir. La solución es: «${s.text}».</span>`;markDone();setTimeout(finishStation,good?850:2200)}
function finishStation(){updateProgress();if(done.length===model().stations.length){const label=subject==='sociales'?'personas y convivencia, colegio y localidad, y seguridad vial':grade==='1'?'leer, escribir y jugar con las palabras':'sinónimos, antónimos, lectura comprensiva y dictado';if(!model().exam){app.innerHTML=`<div class="badge">Ruta terminada</div><h2>¡Has practicado muy bien!</h2><p class="lead">Has practicado ${label}.</p><button class="primary" onclick="switchRoute()">Jugar otra vez</button>`;return}app.innerHTML=`<div class="badge">Ruta completada</div><h2>¡Todas las paradas superadas!</h2><p class="lead">Has practicado ${label}.</p><div class="result"><strong>El examen está listo.</strong><br>Serán ${model().exam==='social'?'10':'8'} preguntas. Al terminar verás la puntuación.</div><button class="primary" onclick="startExam()">Empezar examen</button>`}else{app.innerHTML=`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar. Cuando las tres estén completas, se abrirá el examen.</p>`}}
function startExam(){const stations=model().stations;if(model().exam==='social'){exam=stations.flatMap(s=>s.questions.map(q=>({q,station:s}))).sort(()=>Math.random()-.5).slice(0,10)}else{const questions=stations.filter(s=>s.type==='choice').flatMap(s=>s.questions.map(q=>({q,station:s})));exam=[...questions].sort(()=>Math.random()-.5).slice(0,7);exam.push({dictation:stations.find(s=>s.type==='dictation')})}examIndex=0;score=0;station='exam';renderExam()}
function renderExam(){if(examIndex>=exam.length){const pass=score>=Math.ceil(exam.length*.7);app.innerHTML=`<div class="badge">Examen final terminado</div><h2>${pass?'¡Examen superado!':'Examen terminado'}</h2><div class="result"><strong>${score} de ${exam.length} respuestas correctas.</strong><br>${pass?'Buen trabajo: has terminado la ruta.':'Repasa las actividades y vuelve a intentarlo cuando quieras.'}</div><div class="actions"><button class="primary" onclick="startExam()">Repetir examen</button><button class="secondary" onclick="station=model().stations[0].id;index=0;render()">Volver a actividades</button></div>`;return}const item=exam[examIndex],num=`Pregunta ${examIndex+1} de ${exam.length}`;if(item.dictation){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Dictado</h2><p class="lead">Escucha y escribe la frase.</p><div class="dictation-box"><button class="primary" onclick="speakExam()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg"></audio><textarea id="examDictation" rows="4" placeholder="Escribe las frases"></textarea></div><button class="primary" onclick="examDictation()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;return}const q=item.q;app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2><div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="examAnswer(${i})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function examAnswer(selected){const q=exam[examIndex].q,correct=q[2];document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});if(selected===correct)score++;$('#feedback').textContent=selected===correct?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function speakExam(){const audio=$('#dictationAudio');audio.play()}
function examDictation(){const text=exam[examIndex].dictation.text;if(normalize($('#examDictation').value)===normalize(text))score++;$('#feedback').textContent='Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function render(){updateHeader();updateProgress();const s=model().stations.find(x=>x.id===station)||model().stations[0];if(s.type==='choice')renderChoice(s);if(s.type==='write')renderWrite(s);if(s.type==='hangman')renderHangman(s);if(s.type==='dictation')renderDictation(s)}
setupSelectors();switchRoute();
</script>
</body>
</html>
