<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La ruta de las palabras</title>
<style>
:root{--ink:#1e3147;--muted:#5d6b7c;--paper:#fffdf7;--sky:#dff4f2;--blue:#2169a8;--blue-dark:#164c7d;--orange:#ef9b37;--green:#278266;--red:#b94646;--line:#c8d8df;--shadow:0 10px 25px rgba(31,61,80,.12)}
*{box-sizing:border-box} body{margin:0;background:#edf5f4;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45} button,input,textarea{font:inherit} button{cursor:pointer} textarea{width:100%;min-height:120px;padding:12px;border:2px solid var(--line);border-radius:10px;resize:vertical;color:var(--ink);background:#fff} textarea:focus{outline:3px solid rgba(33,105,168,.22);border-color:var(--blue)} .shell{max-width:980px;margin:0 auto;padding:22px 18px 48px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:4px solid var(--orange);padding:8px 0 18px}.eyebrow{font:700 .78rem/1.1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{margin:.25rem 0 0;font-size:clamp(2rem,7vw,3.9rem);line-height:.98;letter-spacing:-.045em}.top p{max-width:480px;margin:.8rem 0 0;color:var(--muted)}.level{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:nowrap}.level select{border:0;background:transparent;color:var(--ink);font-weight:bold;font-size:1rem}.progress{margin:24px 0 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px 16px;box-shadow:var(--shadow)}.progress-line{display:flex;justify-content:space-between;gap:12px;font-family:Arial,sans-serif;font-size:.9rem;font-weight:bold}.track{height:10px;background:#e3eced;border-radius:99px;margin-top:9px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.station{min-height:86px;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:bold}.station:hover,.station:focus-visible{border-color:var(--blue);outline:none}.station.done{border-color:var(--green);background:#effaf6}.station.locked{opacity:.55}.station small{display:block;font-weight:normal;color:var(--muted);margin-top:4px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(20px,4vw,38px)}h2{font-size:clamp(1.55rem,5vw,2.4rem);margin:0 0 .4rem;line-height:1.1}.lead{color:var(--muted);margin-top:0}.badge{font:bold .8rem Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}.question{font-size:clamp(1.2rem,3vw,1.55rem);margin:25px 0 16px}.choices{display:grid;gap:10px;max-width:680px}.choice{width:100%;border:2px solid var(--line);background:white;border-radius:11px;padding:14px 16px;text-align:left;font-weight:bold;font-size:1.05rem}.choice:hover,.choice:focus-visible{border-color:var(--blue);background:#f2f8fc;outline:none}.choice.correct{border-color:var(--green);background:#eaf8f2}.choice.wrong{border-color:var(--red);background:#fff0ef}.feedback{min-height:30px;margin:16px 0;font-weight:bold}.ok{color:var(--green)}.no{color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.primary,.secondary{border:0;border-radius:11px;min-height:46px;padding:10px 18px;font-weight:bold}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#e5eff2;color:var(--ink)}.passage{padding:17px 18px;border-left:6px solid var(--orange);background:#fff7e9;font-size:1.08rem;margin:20px 0}.dictation-box{background:#eaf5fb;border:1px solid #b9d9e9;border-radius:12px;padding:18px;margin:18px 0}.dictation-box input{width:100%;padding:12px;border:2px solid var(--line);border-radius:9px;margin-top:10px}.hint{font-size:.92rem;color:var(--muted)}.result{padding:18px;border-radius:13px;background:#effaf6;border:1px solid #b8dccf;margin:22px 0}.hidden{display:none!important}.exam-list{margin:18px 0;padding-left:20px}.exam-list li{margin:7px 0}.footer{font:13px Arial,sans-serif;color:var(--muted);margin:18px 2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:650px){.top{display:block}.level{margin-top:18px;display:inline-flex}.stations{grid-template-columns:repeat(2,1fr)}.station{min-height:76px}.panel{padding:22px 18px}}
</style>
<style>
.word-card{margin:18px 0;padding:18px;border:2px dashed var(--orange);border-radius:14px;background:#fff8e8;text-align:center;font:700 clamp(2.2rem,10vw,4rem)/1 Arial,sans-serif;letter-spacing:.06em}.word-input{width:100%;padding:14px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1.4rem}.word-input:focus{outline:3px solid rgba(33,105,168,.22);border-color:var(--blue)}.hangman-word{margin:22px 0 10px;text-align:center;font:700 clamp(2rem,9vw,3.6rem)/1.2 Arial,sans-serif;letter-spacing:.18em;color:var(--blue)}.letter-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:20px 0}.letter{min-height:45px;border:2px solid var(--line);border-radius:9px;background:#fff;font:700 1.1rem Arial,sans-serif;color:var(--ink)}.letter:hover:not(:disabled),.letter:focus-visible{border-color:var(--blue);background:#eaf5ff}.letter:disabled{opacity:.45;cursor:default}@media(max-width:650px){.letter-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">Juego de deberes de lengua</div><h1>La ruta de las palabras</h1><p>Completa las tres paradas y desbloquea el examen final.</p></div><label class="level">Curso <select id="grade" aria-label="Elegir curso"><option value="1">1.º de Primaria</option><option value="3">3.º de Primaria</option></select></label></header>
<section class="progress" aria-label="Progreso"><div class="progress-line"><span id="progressText">0 de 3 paradas completadas</span><span id="badgeText">Explorador/a</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<nav class="stations" aria-label="Paradas del juego">
<button class="station" data-station="vocab"><strong>1. Palabras relacionadas</strong><small>Sinónimos y antónimos</small></button><button class="station" data-station="read"><strong>2. Lectura</strong><small>Comprender un texto</small></button><button class="station" data-station="dict"><strong>3. Dictado</strong><small>Escuchar y escribir</small></button>
</nav>
<section class="panel" id="app" aria-live="polite"></section>
<p class="footer">Consejo para adultos: el dictado puede escucharse con el botón de audio o leerse en voz alta sin que el niño vea la frase.</p>
</main>
<script>
const bank={
1:{syn:[['¿Qué palabra significa casi lo mismo que “feliz”?',['triste','contento','enfadado'],1],['¿Qué palabra significa casi lo mismo que “bonito”?',['feo','lindo','alto'],1],['¿Qué palabra significa casi lo mismo que “rápido”?',['veloz','lento','pequeño'],0]],ant:[['¿Cuál es el contrario de “grande”?',['enorme','pequeño','ancho'],1],['¿Cuál es el contrario de “frío”?',['caliente','helado','blanco'],0],['¿Cuál es el contrario de “abrir”?',['cerrar','mirar','coger'],0]],passage:'Lucía tiene una cometa amarilla. Por la tarde va al parque con su abuelo. Hace viento y la cometa sube muy alto.',read:[['¿De qué color es la cometa?',['Azul','Amarilla','Verde'],1],['¿Con quién va Lucía al parque?',['Con su abuelo','Con su maestra','Con su hermana'],0],['¿Qué hace que la cometa suba?',['La lluvia','El viento','La noche'],1]],dict:'Hoy Hugo va en bici. Beatriz bebe agua fría. Vivo cerca de la biblioteca.'},
3:{syn:[['Elige el sinónimo de “comenzar”.',['terminar','empezar','olvidar'],1],['Elige el sinónimo de “observar”.',['mirar','romper','esconder'],0],['Elige el sinónimo de “valiente”.',['miedoso','atrevido','débil'],1]],ant:[['Elige el antónimo de “generoso”.',['egoísta','amable','alegre'],0],['Elige el antónimo de “cercano”.',['próximo','lejano','conocido'],1],['Elige el antónimo de “aumentar”.',['crecer','disminuir','añadir'],1]],passage:'El sábado, Marcos preparó una maceta para su balcón. Llenó el recipiente de tierra, plantó tres semillas de albahaca y las regó con cuidado. Cada mañana comprobará si han empezado a crecer.',read:[['¿Qué plantó Marcos?',['Tres semillas de albahaca','Un árbol de manzanas','Una flor de papel'],0],['¿Dónde puso la maceta?',['En el balcón','En el colegio','En la cocina'],0],['¿Para qué revisará la maceta cada mañana?',['Para cambiarla de sitio','Para comprobar si crecen las semillas','Para recoger hojas'],1]],dict:'Hoy, Hugo visitó la biblioteca de Beatriz. Había varios libros sobre volcanes y vehículos. Volvimos a casa en autobús, muy contentos.'}
};
let grade=localStorage.getItem('lenguaGrade')||'1';
function loadDone(){const saved=JSON.parse(localStorage.getItem('lenguaDone'+grade)||'[]'),migrated=[];if(saved.includes('syn')||saved.includes('ant'))migrated.push('vocab');for(const item of saved)if(['vocab','read','dict'].includes(item)&&!migrated.includes(item))migrated.push(item);localStorage.setItem('lenguaDone'+grade,JSON.stringify(migrated));return migrated}
let done=loadDone(),station='vocab',index=0,exam=[],examIndex=0,score=0,vocabQuestions=[];
function prepareVocab(){const syn=[...bank[grade].syn].sort(()=>Math.random()-.5),ant=[...bank[grade].ant].sort(()=>Math.random()-.5);vocabQuestions=[syn[0],ant[0],[...syn.slice(1),...ant.slice(1)].sort(()=>Math.random()-.5)[0]].sort(()=>Math.random()-.5)}
const $=s=>document.querySelector(s);const app=$('#app');
$('#grade').value=grade;$('#grade').onchange=e=>{grade=e.target.value;localStorage.setItem('lenguaGrade',grade);done=loadDone();station='vocab';index=0;prepareVocab();render()};
document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;if(station==='vocab')prepareVocab();render()});
function save(){localStorage.setItem('lenguaDone'+grade,JSON.stringify(done));updateProgress()}
function updateProgress(){const n=done.length;$('#progressText').textContent=`${n} de 3 paradas completadas`;$('#fill').style.width=(n/3*100)+'%';$('#badgeText').textContent=n===3?'Listo/a para el examen':n>1?'Aprendiz de palabras':'Explorador/a';document.querySelectorAll('.station').forEach(b=>b.classList.toggle('done',done.includes(b.dataset.station)))}
function markDone(){if(!done.includes(station)){done.push(station);save()} }
function nav(){return `<div class="actions"><button class="secondary" onclick="nextItem()">${index<2?'Siguiente pregunta':'Terminar parada'}</button></div>`}
function choice(q){return `<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="answer(${i},${q[2]})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function answer(selected,correct){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;const resultClass=i===correct?'correct':i===selected?'wrong':'';if(resultClass)b.classList.add(resultClass)});const good=selected===correct;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':'<span class="no">Casi. La respuesta correcta está marcada en verde.</span>';setTimeout(()=>{index++;if(index>=3){markDone();finishStation()}else render()},850)}
function render(){updateProgress();const d=bank[grade];if(station==='vocab'){if(!vocabQuestions.length)prepareVocab();app.innerHTML=`<div class="badge">Parada 1 · Palabras relacionadas</div><h2>Sinónimos y antónimos</h2><p class="lead">Cada pregunta te pedirá encontrar una palabra parecida o una palabra contraria. Lee con atención qué te pregunta.</p>${choice(vocabQuestions[index])}`;return}if(station==='read'){const q=d.read[index];app.innerHTML=`<div class="badge">Parada 2 · Lectura comprensiva</div><h2>Lee con calma</h2><div class="passage">${d.passage}</div>${choice(q)}`;return}if(station==='dict'){app.innerHTML=`<div class="badge">Parada 3 · Dictado</div><h2>Escucha y escribe</h2><p class="lead">Pulsa «Reproducir dictado», escucha la frase las veces que necesites y escríbela. No verás el texto antes de comprobarlo.</p><div class="dictation-box"><button class="primary" onclick="speak()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg">Tu navegador no puede reproducir el audio.</audio><label for="dictation" class="sr-only">Escribe el dictado</label><textarea id="dictation" autocomplete="off" rows="4" placeholder="Escribe aquí las frases"></textarea><p class="hint">La corrección revisa mayúsculas, minúsculas, tildes y signos de puntuación.</p></div><div class="actions"><button class="primary" onclick="checkDictation()">Comprobar</button></div><p class="feedback" id="feedback"></p>`;return}if(station==='exam'){renderExam()}}
function normalize(s){return s.replace(/\s+/g,' ').trim()}
function speak(){const audio=$('#dictationAudio');if(audio){audio.currentTime=0;const playing=audio.play();if(playing)playing.catch(()=>fallbackSpeak());return}fallbackSpeak()}
function fallbackSpeak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(bank[grade].dict);u.lang='es-ES';u.rate=.78;speechSynthesis.speak(u)}
function checkDictation(){const input=$('#dictation'),good=normalize(input.value)===normalize(bank[grade].dict);input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Dictado correcto! Has escrito todas las frases.</span>':`<span class="no">Hay algo que corregir. La solución es: «${bank[grade].dict}».</span>`;markDone();setTimeout(finishStation,good?850:2200)}
function finishStation(){updateProgress();if(done.length===3){app.innerHTML=`<div class="badge">Ruta completada</div><h2>¡Todas las paradas superadas!</h2><p class="lead">Has practicado sinónimos, antónimos, lectura comprensiva y dictado.</p><div class="result"><strong>El examen está listo.</strong><br>Serán 8 preguntas. Al terminar verás la puntuación.</div><button class="primary" onclick="startExam()">Empezar examen</button>`}else{app.innerHTML=`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar. Cuando las tres estén completas, se abrirá el examen.</p>`}}
function startExam(){const d=bank[grade];exam=[...d.syn,...d.ant,...d.read].sort(()=>Math.random()-.5).slice(0,7);exam.push(['DICTADO',d.dict]);examIndex=0;score=0;station='exam';renderExam()}
function renderExam(){if(examIndex>=exam.length){const pass=score>=6;app.innerHTML=`<div class="badge">Examen final terminado</div><h2>${pass?'¡Examen superado!':'Examen terminado'}</h2><div class="result"><strong>${score} de ${exam.length} respuestas correctas.</strong><br>${pass?'Has demostrado que sabes usar las palabras y comprender lo que lees.':'Repasa las respuestas marcadas y vuelve a intentarlo cuando quieras.'}</div><div class="actions"><button class="primary" onclick="startExam()">Repetir examen</button><button class="secondary" onclick="station='vocab';prepareVocab();render()">Volver a actividades</button></div>`;return}const q=exam[examIndex];const num=`Pregunta ${examIndex+1} de ${exam.length}`;if(q[0]==='DICTADO'){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Dictado</h2><p class="lead">Pulsa «Reproducir dictado», escucha y escribe la frase. Puedes repetir el audio todas las veces que necesites.</p><div class="dictation-box"><button class="primary" onclick="speak()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg">Tu navegador no puede reproducir el audio.</audio><textarea id="examDictation" rows="4" placeholder="Escribe las frases"></textarea></div><button class="primary" onclick="examDictation()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;return}app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2>${choiceExam(q)}`}
function choiceExam(q){return `<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="examAnswer(${i},${q[2]})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function examAnswer(selected,correct){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;const resultClass=i===correct?'correct':i===selected?'wrong':'';if(resultClass)b.classList.add(resultClass)});if(selected===correct)score++;$('#feedback').textContent=selected===correct?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function examDictation(){const good=normalize($('#examDictation').value)===normalize(bank[grade].dict);if(good)score++;$('#feedback').textContent=good?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
const firstGrade={
  read:[
    ['¿Cuál de estas palabras dice «sol»?',['sol','sal','sopa'],0],
    ['¿Cuál de estas palabras dice «mesa»?',['masa','mesa','misa'],1],
    ['¿Cuál de estas palabras dice «luna»?',['lana','luna','lona'],1]
  ],
  write:['sol','casa','mesa','luna','pato','mano'],
  hangman:['sol','casa','mesa','luna','pato','mano']
};
let hangman={word:'',guesses:[]};
function stationsForGrade(){return grade==='1'?[['readWords','1. Lee palabras','Lee y elige'],['writeWords','2. Escribe palabras','Copia palabras cortas'],['hangman','3. Ahorcado','Adivina la palabra']]:[['vocab','1. Palabras relacionadas','Sinónimos y antónimos'],['read','2. Lectura','Comprender un texto'],['dict','3. Dictado','Escuchar y escribir']]}
function progressKey(){return `lenguaDone-v2-${grade}`}
function loadCurrentDone(){const valid=stationsForGrade().map(x=>x[0]);let saved=JSON.parse(localStorage.getItem(progressKey())||'[]');if(grade==='3'&&saved.length===0){const old=JSON.parse(localStorage.getItem('lenguaDone3')||'[]');if(old.includes('syn')||old.includes('ant'))saved.push('vocab');for(const item of old)if(valid.includes(item)&&!saved.includes(item))saved.push(item)}saved=saved.filter(x=>valid.includes(x));localStorage.setItem(progressKey(),JSON.stringify(saved));return saved}
function refreshStations(){document.querySelector('.stations').innerHTML=stationsForGrade().map(([id,title,subtitle])=>`<button class="station" data-station="${id}"><strong>${title}</strong><small>${subtitle}</small></button>`).join('');document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;if(station==='vocab')prepareVocab();if(station==='hangman')startHangman();render()})}
function switchGrade(value){grade=value;localStorage.setItem('lenguaGrade',grade);done=loadCurrentDone();station=stationsForGrade()[0][0];index=0;vocabQuestions=[];hangman={word:'',guesses:[]};refreshStations();if(station==='vocab')prepareVocab();render()}
function init(){document.querySelector('.stations').style.gridTemplateColumns='repeat(3,1fr)';$('#grade').value=grade;$('#grade').onchange=e=>switchGrade(e.target.value);switchGrade(grade)}
function save(){localStorage.setItem(progressKey(),JSON.stringify(done));updateProgress()}
function updateProgress(){const stations=stationsForGrade(),n=done.filter(x=>stations.some(s=>s[0]===x)).length;$('#progressText').textContent=`${n} de ${stations.length} paradas completadas`;$('#fill').style.width=(n/stations.length*100)+'%';$('#badgeText').textContent=n===stations.length?'¡Ruta terminada!':n>1?'Aprendiz de palabras':'Explorador/a';document.querySelectorAll('.station').forEach(b=>b.classList.toggle('done',done.includes(b.dataset.station)))}
function markDone(){if(!done.includes(station)){done.push(station);save()}}
function renderFirst(){if(station==='readWords'){const q=firstGrade.read[index];app.innerHTML=`<div class="badge">Parada 1 · Lee palabras</div><h2>¿Qué palabra ves?</h2><p class="lead">Mira las letras y elige la palabra que te pide la pregunta.</p>${choice(q)}`;return}if(station==='writeWords'){const word=firstGrade.write[index%firstGrade.write.length];app.innerHTML=`<div class="badge">Parada 2 · Escribe palabras</div><h2>Copia una palabra</h2><p class="lead">Mira la palabra y escríbela despacio.</p><div class="word-card">${word}</div><label for="wordInput" class="sr-only">Escribe la palabra</label><input id="wordInput" class="word-input" autocomplete="off" autocapitalize="off" placeholder="Escribe aquí"><div class="actions"><button class="primary" onclick="checkWord()">Comprobar</button></div><p class="feedback" id="feedback"></p>`;return}if(station==='hangman'){if(!hangman.word)startHangman();renderHangman()}}
function checkWord(){const expected=firstGrade.write[index%firstGrade.write.length],input=$('#wordInput'),good=normalize(input.value).toLowerCase()===expected;input.disabled=true;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! La has escrito correctamente.</span>':`<span class="no">La palabra era «${expected}».</span>`;setTimeout(()=>{index++;if(index>=3){markDone();finishStation()}else render()},900)}
function startHangman(){hangman={word:firstGrade.hangman[Math.floor(Math.random()*firstGrade.hangman.length)],guesses:[]}}
function renderHangman(){const letters='abcdefghijklmnñopqrstuvwxyz'.split(''),word=hangman.word,visible=word.split('').map(letter=>hangman.guesses.includes(letter)?letter:'_').join(' '),mistakes=hangman.guesses.filter(letter=>!word.includes(letter));app.innerHTML=`<div class="badge">Parada 3 · Ahorcado</div><h2>Adivina la palabra</h2><p class="lead">Pulsa las letras. Tienes seis intentos que no estén en la palabra.</p><div class="hangman-word" aria-label="Palabra a adivinar">${visible}</div><p class="hint">Fallos: ${mistakes.length} de 6 ${mistakes.length?'· '+mistakes.join(', '):''}</p><div class="letter-grid">${letters.map(letter=>`<button class="letter" ${hangman.guesses.includes(letter)?'disabled':''} onclick="guessLetter('${letter}')">${letter}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function guessLetter(letter){if(hangman.guesses.includes(letter))return;hangman.guesses.push(letter);const word=hangman.word,won=word.split('').every(x=>hangman.guesses.includes(x)),mistakes=hangman.guesses.filter(x=>!word.includes(x)).length;if(won){renderHangman();$('#feedback').innerHTML='<span class="ok">¡Muy bien! Has adivinado la palabra.</span>';document.querySelectorAll('.letter').forEach(b=>b.disabled=true);markDone();setTimeout(finishStation,1000);return}if(mistakes>=6){app.innerHTML=`<div class="badge">Ahorcado</div><h2>La palabra era «${word}»</h2><p class="lead">No pasa nada. Prueba otra palabra.</p><button class="primary" onclick="startHangman();render()">Jugar otra vez</button>`;return}renderHangman()}
function render(){updateProgress();if(grade==='1'){renderFirst();return}const d=bank[grade];if(station==='vocab'){if(!vocabQuestions.length)prepareVocab();app.innerHTML=`<div class="badge">Parada 1 · Palabras relacionadas</div><h2>Sinónimos y antónimos</h2><p class="lead">Cada pregunta te pedirá encontrar una palabra parecida o una palabra contraria. Lee con atención qué te pregunta.</p>${choice(vocabQuestions[index])}`;return}if(station==='read'){const q=d.read[index];app.innerHTML=`<div class="badge">Parada 2 · Lectura comprensiva</div><h2>Lee con calma</h2><div class="passage">${d.passage}</div>${choice(q)}`;return}if(station==='dict'){app.innerHTML=`<div class="badge">Parada 3 · Dictado</div><h2>Escucha y escribe</h2><p class="lead">Pulsa «Reproducir dictado», escucha la frase las veces que necesites y escríbela. No verás el texto antes de comprobarlo.</p><div class="dictation-box"><button class="primary" onclick="speak()">Reproducir dictado</button><audio id="dictationAudio" controls preload="metadata"><source src="audio/dictado-${grade}.mp3" type="audio/mpeg">Tu navegador no puede reproducir el audio.</audio><label for="dictation" class="sr-only">Escribe el dictado</label><textarea id="dictation" autocomplete="off" rows="4" placeholder="Escribe aquí las frases"></textarea><p class="hint">La corrección revisa mayúsculas, minúsculas, tildes y signos de puntuación.</p></div><div class="actions"><button class="primary" onclick="checkDictation()">Comprobar</button></div><p class="feedback" id="feedback"></p>`;return}if(station==='exam')renderExam()}
function answer(selected,correct){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;const resultClass=i===correct?'correct':i===selected?'wrong':'';if(resultClass)b.classList.add(resultClass)});const good=selected===correct;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':'<span class="no">Casi. La respuesta correcta está marcada en verde.</span>';setTimeout(()=>{index++;if(index>=3){markDone();finishStation()}else render()},850)}
function finishStation(){updateProgress();if(grade==='1'){app.innerHTML=done.length===3?`<div class="badge">Ruta terminada</div><h2>¡Has practicado muy bien!</h2><p class="lead">Has leído, escrito y jugado con las palabras.</p><button class="primary" onclick="switchGrade('1')">Jugar otra vez</button>`:`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar.</p>`;return}if(done.length===3){app.innerHTML=`<div class="badge">Ruta completada</div><h2>¡Todas las paradas superadas!</h2><p class="lead">Has practicado sinónimos, antónimos, lectura comprensiva y dictado.</p><div class="result"><strong>El examen está listo.</strong><br>Serán 8 preguntas. Al terminar verás la puntuación.</div><button class="primary" onclick="startExam()">Empezar examen</button>`}else{app.innerHTML=`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar. Cuando las tres estén completas, se abrirá el examen.</p>`}}
init();
</script>
</body></html>
