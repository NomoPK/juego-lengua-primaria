<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La ruta de las palabras</title>
<style>
:root{--ink:#1e3147;--muted:#5d6b7c;--paper:#fffdf7;--sky:#dff4f2;--blue:#2169a8;--blue-dark:#164c7d;--orange:#ef9b37;--green:#278266;--red:#b94646;--line:#c8d8df;--shadow:0 10px 25px rgba(31,61,80,.12)}
*{box-sizing:border-box} body{margin:0;background:#edf5f4;color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.45} button,input{font:inherit} button{cursor:pointer} .shell{max-width:980px;margin:0 auto;padding:22px 18px 48px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:4px solid var(--orange);padding:8px 0 18px}.eyebrow{font:700 .78rem/1.1 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{margin:.25rem 0 0;font-size:clamp(2rem,7vw,3.9rem);line-height:.98;letter-spacing:-.045em}.top p{max-width:480px;margin:.8rem 0 0;color:var(--muted)}.level{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:nowrap}.level select{border:0;background:transparent;color:var(--ink);font-weight:bold;font-size:1rem}.progress{margin:24px 0 18px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px 16px;box-shadow:var(--shadow)}.progress-line{display:flex;justify-content:space-between;gap:12px;font-family:Arial,sans-serif;font-size:.9rem;font-weight:bold}.track{height:10px;background:#e3eced;border-radius:99px;margin-top:9px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:99px;transition:width .3s}.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.station{min-height:86px;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:bold}.station:hover,.station:focus-visible{border-color:var(--blue);outline:none}.station.done{border-color:var(--green);background:#effaf6}.station.locked{opacity:.55}.station small{display:block;font-weight:normal;color:var(--muted);margin-top:4px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(20px,4vw,38px)}h2{font-size:clamp(1.55rem,5vw,2.4rem);margin:0 0 .4rem;line-height:1.1}.lead{color:var(--muted);margin-top:0}.badge{font:bold .8rem Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}.question{font-size:clamp(1.2rem,3vw,1.55rem);margin:25px 0 16px}.choices{display:grid;gap:10px;max-width:680px}.choice{width:100%;border:2px solid var(--line);background:white;border-radius:11px;padding:14px 16px;text-align:left;font-weight:bold;font-size:1.05rem}.choice:hover,.choice:focus-visible{border-color:var(--blue);background:#f2f8fc;outline:none}.choice.correct{border-color:var(--green);background:#eaf8f2}.choice.wrong{border-color:var(--red);background:#fff0ef}.feedback{min-height:30px;margin:16px 0;font-weight:bold}.ok{color:var(--green)}.no{color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.primary,.secondary{border:0;border-radius:11px;min-height:46px;padding:10px 18px;font-weight:bold}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#e5eff2;color:var(--ink)}.passage{padding:17px 18px;border-left:6px solid var(--orange);background:#fff7e9;font-size:1.08rem;margin:20px 0}.dictation-box{background:#eaf5fb;border:1px solid #b9d9e9;border-radius:12px;padding:18px;margin:18px 0}.dictation-box input{width:100%;padding:12px;border:2px solid var(--line);border-radius:9px;margin-top:10px}.hint{font-size:.92rem;color:var(--muted)}.result{padding:18px;border-radius:13px;background:#effaf6;border:1px solid #b8dccf;margin:22px 0}.hidden{display:none!important}.exam-list{margin:18px 0;padding-left:20px}.exam-list li{margin:7px 0}.footer{font:13px Arial,sans-serif;color:var(--muted);margin:18px 2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:650px){.top{display:block}.level{margin-top:18px;display:inline-flex}.stations{grid-template-columns:repeat(2,1fr)}.station{min-height:76px}.panel{padding:22px 18px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">Juego de deberes de lengua</div><h1>La ruta de las palabras</h1><p>Completa las cuatro paradas y desbloquea el examen final.</p></div><label class="level">Curso <select id="grade" aria-label="Elegir curso"><option value="1">1.º de Primaria</option><option value="3">3.º de Primaria</option></select></label></header>
<section class="progress" aria-label="Progreso"><div class="progress-line"><span id="progressText">0 de 4 paradas completadas</span><span id="badgeText">Explorador/a</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<nav class="stations" aria-label="Paradas del juego">
<button class="station" data-station="syn"><strong>1. Sinónimos</strong><small>Palabras parecidas</small></button><button class="station" data-station="ant"><strong>2. Antónimos</strong><small>Palabras contrarias</small></button><button class="station" data-station="read"><strong>3. Lectura</strong><small>Comprender un texto</small></button><button class="station" data-station="dict"><strong>4. Dictado</strong><small>Escuchar y escribir</small></button>
</nav>
<section class="panel" id="app" aria-live="polite"></section>
<p class="footer">Consejo para adultos: el dictado puede escucharse con el botón de audio o leerse en voz alta sin que el niño vea la frase.</p>
</main>
<script>
const bank={
1:{syn:[['¿Qué palabra significa casi lo mismo que “feliz”?',['triste','contento','enfadado'],1],['¿Qué palabra significa casi lo mismo que “bonito”?',['feo','lindo','alto'],1],['¿Qué palabra significa casi lo mismo que “rápido”?',['veloz','lento','pequeño'],0]],ant:[['¿Cuál es el contrario de “grande”?',['enorme','pequeño','ancho'],1],['¿Cuál es el contrario de “frío”?',['caliente','helado','blanco'],0],['¿Cuál es el contrario de “abrir”?',['cerrar','mirar','coger'],0]],passage:'Lucía tiene una cometa amarilla. Por la tarde va al parque con su abuelo. Hace viento y la cometa sube muy alto.',read:[['¿De qué color es la cometa?',['Azul','Amarilla','Verde'],1],['¿Con quién va Lucía al parque?',['Con su abuelo','Con su maestra','Con su hermana'],0],['¿Qué hace que la cometa suba?',['La lluvia','El viento','La noche'],1]],dict:'El gato duerme en la cama.'},
3:{syn:[['Elige el sinónimo de “comenzar”.',['terminar','empezar','olvidar'],1],['Elige el sinónimo de “observar”.',['mirar','romper','esconder'],0],['Elige el sinónimo de “valiente”.',['miedoso','atrevido','débil'],1]],ant:[['Elige el antónimo de “generoso”.',['egoísta','amable','alegre'],0],['Elige el antónimo de “cercano”.',['próximo','lejano','conocido'],1],['Elige el antónimo de “aumentar”.',['crecer','disminuir','añadir'],1]],passage:'El sábado, Marcos preparó una maceta para su balcón. Llenó el recipiente de tierra, plantó tres semillas de albahaca y las regó con cuidado. Cada mañana comprobará si han empezado a crecer.',read:[['¿Qué plantó Marcos?',['Tres semillas de albahaca','Un árbol de manzanas','Una flor de papel'],0],['¿Dónde puso la maceta?',['En el balcón','En el colegio','En la cocina'],0],['¿Para qué revisará la maceta cada mañana?',['Para cambiarla de sitio','Para comprobar si crecen las semillas','Para recoger hojas'],1]],dict:'Mañana iremos al museo con la clase.'}
};
let grade=localStorage.getItem('lenguaGrade')||'1',done=JSON.parse(localStorage.getItem('lenguaDone'+grade)||'[]'),station='syn',index=0,exam=[],examIndex=0,score=0;
const $=s=>document.querySelector(s);const app=$('#app');
$('#grade').value=grade;$('#grade').onchange=e=>{grade=e.target.value;localStorage.setItem('lenguaGrade',grade);done=JSON.parse(localStorage.getItem('lenguaDone'+grade)||'[]');station='syn';index=0;render()};
document.querySelectorAll('.station').forEach(b=>b.onclick=()=>{station=b.dataset.station;index=0;render()});
function save(){localStorage.setItem('lenguaDone'+grade,JSON.stringify(done));updateProgress()}
function updateProgress(){const n=done.length;$('#progressText').textContent=`${n} de 4 paradas completadas`;$('#fill').style.width=(n*25)+'%';$('#badgeText').textContent=n===4?'Listo/a para el examen':n>1?'Aprendiz de palabras':'Explorador/a';document.querySelectorAll('.station').forEach(b=>b.classList.toggle('done',done.includes(b.dataset.station)))}
function markDone(){if(!done.includes(station)){done.push(station);save()} }
function nav(){return `<div class="actions"><button class="secondary" onclick="nextItem()">${index<2?'Siguiente pregunta':'Terminar parada'}</button></div>`}
function choice(q){return `<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="answer(${i},${q[2]})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function answer(selected,correct){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;const resultClass=i===correct?'correct':i===selected?'wrong':'';if(resultClass)b.classList.add(resultClass)});const good=selected===correct;$('#feedback').innerHTML=good?'<span class="ok">¡Muy bien! Has acertado.</span>':'<span class="no">Casi. La respuesta correcta está marcada en verde.</span>';setTimeout(()=>{index++;if(index>=3){markDone();finishStation()}else render()},850)}
function render(){updateProgress();const d=bank[grade];if(station==='syn'||station==='ant'){const title=station==='syn'?'Sinónimos':'Antónimos';app.innerHTML=`<div class="badge">Parada ${station==='syn'?1:2} · ${title}</div><h2>${title}</h2><p class="lead">${station==='syn'?'Busca palabras que tienen un significado parecido.':'Busca palabras que significan lo contrario.'}</p>${choice(d[station][index])}`;return}if(station==='read'){const q=d.read[index];app.innerHTML=`<div class="badge">Parada 3 · Lectura comprensiva</div><h2>Lee con calma</h2><div class="passage">${d.passage}</div>${choice(q)}`;return}if(station==='dict'){app.innerHTML=`<div class="badge">Parada 4 · Dictado</div><h2>Escucha y escribe</h2><p class="lead">Pulsa el botón, escucha la frase y escríbela. Después corrige si hace falta.</p><div class="dictation-box"><button class="primary" onclick="speak()">Escuchar el dictado</button><label for="dictation" class="sr-only">Escribe el dictado</label><input id="dictation" autocomplete="off" placeholder="Escribe aquí la frase" /><p class="hint">No te preocupes por las mayúsculas o los puntos: revisamos las palabras.</p></div><div class="actions"><button class="primary" onclick="checkDictation()">Comprobar</button></div><p class="feedback" id="feedback"></p>`;return}if(station==='exam'){renderExam()}}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ\s]/g,'').replace(/\s+/g,' ').trim()}
function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(bank[grade].dict);u.lang='es-ES';u.rate=.78;speechSynthesis.speak(u)}
function checkDictation(){const input=$('#dictation'),good=normalize(input.value)===normalize(bank[grade].dict);$('#feedback').innerHTML=good?'<span class="ok">¡Dictado correcto! Ya has terminado la ruta.</span>':`<span class="no">Revisa y prueba de nuevo. Pista: «${bank[grade].dict.split(' ').length} palabras».</span>`;if(good){markDone();setTimeout(finishStation,650)}}
function finishStation(){updateProgress();if(done.length===4){app.innerHTML=`<div class="badge">Ruta completada</div><h2>¡Todas las paradas superadas!</h2><p class="lead">Has practicado sinónimos, antónimos, lectura comprensiva y dictado.</p><div class="result"><strong>El examen está listo.</strong><br>Serán 8 preguntas. Al terminar verás la puntuación.</div><button class="primary" onclick="startExam()">Empezar examen</button>`}else{app.innerHTML=`<div class="badge">Parada superada</div><h2>¡Buen trabajo!</h2><p class="lead">Elige otra parada para continuar. Cuando las cuatro estén completas, se abrirá el examen.</p>`}}
function startExam(){const d=bank[grade];exam=[...d.syn,...d.ant,...d.read].sort(()=>Math.random()-.5).slice(0,7);exam.push(['DICTADO',d.dict]);examIndex=0;score=0;station='exam';renderExam()}
function renderExam(){if(examIndex>=exam.length){const pass=score>=6;app.innerHTML=`<div class="badge">Examen final terminado</div><h2>${pass?'¡Examen superado!':'Examen terminado'}</h2><div class="result"><strong>${score} de ${exam.length} respuestas correctas.</strong><br>${pass?'Has demostrado que sabes usar las palabras y comprender lo que lees.':'Repasa las respuestas marcadas y vuelve a intentarlo cuando quieras.'}</div><div class="actions"><button class="primary" onclick="startExam()">Repetir examen</button><button class="secondary" onclick="station='syn';render()">Volver a actividades</button></div>`;return}const q=exam[examIndex];const num=`Pregunta ${examIndex+1} de ${exam.length}`;if(q[0]==='DICTADO'){app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Dictado</h2><p class="lead">Escucha la frase y escríbela.</p><div class="dictation-box"><button class="primary" onclick="speak()">Escuchar</button><input id="examDictation" placeholder="Escribe la frase" autocomplete="off"></div><button class="primary" onclick="examDictation()">Enviar respuesta</button><p class="feedback" id="feedback"></p>`;return}app.innerHTML=`<div class="badge">Examen · ${num}</div><h2>Elige la respuesta</h2>${choiceExam(q)}`}
function choiceExam(q){return `<div class="question">${q[0]}</div><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="examAnswer(${i},${q[2]})">${x}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function examAnswer(selected,correct){document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;const resultClass=i===correct?'correct':i===selected?'wrong':'';if(resultClass)b.classList.add(resultClass)});if(selected===correct)score++;$('#feedback').textContent=selected===correct?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
function examDictation(){const good=normalize($('#examDictation').value)===normalize(bank[grade].dict);if(good)score++;$('#feedback').textContent=good?'Correcto.':'Respuesta revisada.';setTimeout(()=>{examIndex++;renderExam()},650)}
render();
</script>
</body></html>
